name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      backend: ${{ steps.filter.outputs.backend }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - 'proto/**'
              - 'buf*.yaml'
            backend:
              - 'services/**'
              - 'gen/go/**'
              - 'proto/**'
              - 'buf*.yaml'
            proto:
              - 'proto/**'
              - 'buf*.yaml'

  client:
    name: Client · analyze & test
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5 # keep in sync with the local dev toolchain
          cache: true

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Check architecture imports
        working-directory: client
        run: dart run tool/check_architecture.dart

      - name: Test
        working-directory: client
        run: flutter test

  backend:
    name: Backend · build, vet & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: |
            services/core/go.sum
            gen/go/go.sum

      - name: Build
        working-directory: services/core
        run: go build ./...

      - name: Vet
        working-directory: services/core
        run: go vet ./...

      - name: Test
        working-directory: services/core
        run: go test ./...

  proto:
    name: Protobuf · lint & breaking
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          # PR comments require issues:write, which the default token lacks
          # on private repositories.
          pr_comment: false
          breaking: true
          breaking_against: >-
            https://github.com/${{ github.repository }}.git#branch=main,subdir=proto

  ci:
    name: CI gate
    if: always()
    needs: [changes, client, backend, proto]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          test "${{ needs.changes.result }}" = "success"
          for result in "${{ needs.client.result }}" "${{ needs.backend.result }}" "${{ needs.proto.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
