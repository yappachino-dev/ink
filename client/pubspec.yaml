name: ink 
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  
  # Network & Auth
  connectivity_plus: ^7.3.1
  protobuf: ^6.1.0
  grpc: ^5.1.0
  http2: ^2.3.1
  pointycastle: ^3.9.1

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  drift: ^2.35.0

  # Crypto
  bip39: ^1.0.6
  crypto: ^3.0.7
  cryptography: ^2.9.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  flutter_quill: ^11.6.0
  flutter_quill_extensions: ^11.0.0
  slang_flutter: ^4.19.0
  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1
  flex_color_scheme: ^8.4.0
  table_calendar: ^3.2.1
  pattern_lock: ^2.0.0

  # Navigation
  go_router: ^18.0.1

  # Testing
  mocktail: ^1.0.5

  # Utils
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  unorm_dart: ^0.3.2
  fpdart: ^1.2.0
  logger: ^2.8.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Builders
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  go_router_builder: ^4.5.0

  # Linting
  very_good_analysis: ^10.3.0

flutter:
  assets:
    - assets/images/
    - assets/fonts/inter/

  uses-material-design: true
