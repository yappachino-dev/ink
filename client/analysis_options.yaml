include: package:very_good_analysis/analysis_options.yaml 

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated/**"
    - "lib/core/infrastructure/grpc/gen/**"
    # Generated by `drift_dev schema generate` — see Makefile schema-dump/schema-generate.
    - "test/migrations/schema*.dart"
    - build/**
    - android/**

  errors:
    # Existing ports intentionally return Futures without awaiting in their
    # synchronous adapters; migrate those adapters separately.
    async_return_with_no_await: ignore

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

plugins:
  riverpod_lint: 3.1.3

linter:
  rules:
    public_member_api_docs: false
    sort_pub_dependencies: false
