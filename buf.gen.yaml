version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/yappachino-dev/ink/services/gen/pb
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: services/gen/pb
    opt: paths=source_relative

  - remote: buf.build/grpc/go:v1.6.2
    out: services/gen/pb
    opt: paths=source_relative

  - remote: buf.build/protocolbuffers/dart:v25.0.0
    out: client/lib/core/infrastructure/api/gen
    opt:
      - grpc
